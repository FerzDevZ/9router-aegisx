name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-verify:
    name: Lint + baseline verifies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root deps
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: ESLint
        run: npx eslint src open-sse scripts --max-warnings 0 || npx eslint src open-sse scripts
      - name: Provider registry baseline (no drift)
        run: |
          node tests/__baseline__/verify-providers.mjs
          node tests/__baseline__/verify-alias.mjs
          node tests/__baseline__/verify-oauth-urls.mjs

  build:
    name: Next build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
