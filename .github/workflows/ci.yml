name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-verify:
    name: Lint + baseline verifies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root deps
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: ESLint (0 errors; warnings tracked, not gating)
        run: npx eslint src open-sse scripts
      - name: Provider registry baseline (no drift)
        run: |
          node tests/__baseline__/verify-providers.mjs
          node tests/__baseline__/verify-alias.mjs
          node tests/__baseline__/verify-oauth-urls.mjs

  unit-tests:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root deps
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Install test deps
        run: npm --prefix tests install --no-audit --no-fund
      - name: Install test binaries (ffmpeg for codex STT conversion tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Run unit suite
        working-directory: tests
        run: node_modules/.bin/vitest run
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Explicit flag for tests that must skip on hosted runners
          # (cli-connect's writer flow depends on dev-machine env).
          CI_RUNNER: github

  docker-build:
    name: Docker build (amd64, no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=aegisx-ci
          cache-to: type=gha,mode=max,scope=aegisx-ci

  build:
    name: Next build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
